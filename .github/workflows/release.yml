name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'npm version to publish (e.g. 15.0.0). Leave empty to publish package.json version.'
        required: false
        type: string

permissions:
  contents: read
  id-token: write # Enables Trusted Publishing later if npm account MFA becomes available

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: yarn

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v${TAG} does not match package.json version ${PKG}"
            exit 1
          fi

      - name: Test and build
        run: |
          yarn typecheck
          yarn test --run
          yarn build

      - name: Set version from input
        if: inputs.version != ''
        run: npm version "${{ inputs.version }}" --no-git-tag-version

      - name: Publish to npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          MAJOR="${VERSION%%.*}"
          npm publish --access public --tag "v${MAJOR}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
