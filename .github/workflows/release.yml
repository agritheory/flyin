name: Release

on:
  push:
    branches:
      - 'version-*'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 15.2.0). Leave empty on a version-* branch to publish the next patch.'
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@agritheory'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION}"
          else
            MAJOR="${GITHUB_REF_NAME#version-}"
            if ! [[ "${MAJOR}" =~ ^[0-9]+$ ]]; then
              echo "Cannot infer a major version from branch '${GITHUB_REF_NAME}'"
              exit 1
            fi
            LATEST="$(git tag -l "v${MAJOR}.*" --sort=-v:refname | head -n 1)"
            if [[ -z "${LATEST}" ]]; then
              VERSION="$(node -p "require('./package.json').version")"
              echo "No v${MAJOR}.* tag yet; using package.json ${VERSION}"
            else
              BASE="${LATEST#v}"
              BASE="${BASE%%-*}"
              IFS='.' read -r MA MI PA <<<"${BASE}"
              VERSION="${MA}.${MI}.$((10#${PA} + 1))"
              echo "Latest tag is ${LATEST}; publishing ${VERSION}"
            fi
          fi
          VERSION="${VERSION#v}"
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version '${VERSION}' — need X.Y.Z (for example 15.2.0)"
            exit 1
          fi
          echo "Publishing @agritheory/flyin@${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          yarn version --new-version "${VERSION}" --no-git-tag-version

      - name: Test and build
        run: |
          yarn lint
          yarn typecheck
          yarn test --run
          yarn build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
